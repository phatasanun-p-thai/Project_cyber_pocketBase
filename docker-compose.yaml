services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    image: pocketbase-security-monitor
    container_name: pb-secmon
    command: serve --http 0.0.0.0:8090

    ports:
      - "127.0.0.1:${POCKETBASE_PORT}:8090"

    environment:
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TLS=${SMTP_TLS:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}

    volumes:
      - ./pb_data:/app/pb_data

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"